runtime: python313
entrypoint: gunicorn -b :$PORT server:app

instance_class: F1

# One instance keeps the in-memory sign-up rate limit authoritative
automatic_scaling:
  max_instances: 1

env_variables:
    ENV_TYPE: <Dev or Prod>
    SPREADSHEET: <Google Sheets spreadsheet ID>
    RANGE: <Google Sheets spreadsheet range where email addresses are stored>
